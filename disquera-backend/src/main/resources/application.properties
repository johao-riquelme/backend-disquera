spring.application.name=disquera-backend
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disquera?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.error.include-message=always
server.error.include-binding-errors=always

logging.level.org.springframework.web=DEBUG
google.client.id=795445927815-iujt2mcebkad900dcu49194rjabhibll.apps.googleusercontent.com
