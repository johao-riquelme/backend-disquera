spring.application.name=disquera-backend
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disquera?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-binding-errors=never

logging.level.org.springframework.web=INFO

google.client.id=795445927815-iujt2mcebkad900dcu49194rjabhibll.apps.googleusercontent.com

webpay.return-url=http://localhost:5173/webpay/retorno
webpay.api-key-id=${WEBPAY_API_KEY_ID:597055555532}
webpay.api-key-secret=${WEBPAY_API_KEY_SECRET:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000
jwt.issuer=the-reyes-records
jwt.audience=disquera-api

jwt.cookie.secure=${JWT_COOKIE_SECURE:false}

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persistAuthorization=false
google.auto-link.admin-ids=${GOOGLE_AUTO_LINK_ADMIN_IDS:}